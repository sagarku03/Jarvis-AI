<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Forge</title>
<style>
  html, body { margin: 0; height: 100vh; min-height: 100vh; overflow: hidden; background: transparent; touch-action: none; }
  /* Colors arrive from Kotlin (Nova theme) through Forge.init; these are only first-paint fallbacks. */
  body { background: linear-gradient(180deg, var(--top, #15113a) 0%, var(--bg, #06050e) 100%); }
  canvas { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; transition: filter 0.9s ease; }
  html.failed canvas { filter: grayscale(0.92) brightness(0.8); }
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<script type="importmap">{ "imports": { "three": "./three.module.min.js" } }</script>
<script type="module" src="forge.js"></script>
</body>
</html>
